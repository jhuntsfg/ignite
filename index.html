<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGNITE 2027 | Hunt Agency</title>
  <meta name="description" content="Join the Hunt Agency at IGNITE 2027, March 1–3 in Dallas, Texas. Get your ticket and book your room.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="banner" id="banner">
      <div class="banner-text">
        <p class="banner-kicker">Are you ready to</p>
        <p class="banner-headline">Go the Distance?</p>
        <h1 class="banner-event"><span data-event="name">IGNITE 2027</span></h1>
        <p class="banner-theme" data-event="theme">Going the Distance</p>
        <p class="banner-dates" data-event="dates">March 1–3, 2027</p>
        <p class="banner-location" data-event="location">Dallas, Texas</p>
        <a class="banner-site" data-event-site href="#"></a>
      </div>
    </header>

    <section class="intro">
      <h2>The <span data-agency>Hunt Agency</span> Shows Up BIG for IGNITE</h2>
    </section>

    <section class="cards" id="cards" aria-label="Tickets and hotel"></section>

    <section class="faq-box" id="faq">
      <h2>FAQs</h2>
      <p class="sub">Get Your Questions Answered</p>
      <button class="btn" id="faq-toggle" aria-expanded="false" aria-controls="faq-list">Check Out the FAQs</button>
      <div class="faq-list" id="faq-list" hidden></div>
    </section>

    <section class="video" id="video" aria-label="Message from the Hunt Agency"></section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> <span data-agency>Hunt Agency</span>. IGNITE is an independent event; see the official event site for full details.</p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
